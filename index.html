<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <title>問い合わせフォーム</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>お問合せフォーム</h1>
        <form method="post" action="mail_confirm.php">
            <div>
                <label>名前</label><br>
                <input type="text" name="name">
            </div>

            <div>
                <label>メールアドレス</label><br>
                <input type="text" name="mail" placeholder="メールを入力">
            </div>

            <div>
                <label>年齢</label><br>
                    <select name="age">
                        <option value="10代">10代</option>
                        <option value="10代">20代</option>
                        <option value="10代">30代</option>
                        <option value="10代">30代以上</option>
                    </select>
            </div>

            <div>
                <label>コメント</label><br>
                <textarea row = "7" cols="35" name="coments"></textarea>
            </div>

            <div>
                <input class="button" type="submit" value="送信する">
            </div>

        </form>
    </body>

</html>
